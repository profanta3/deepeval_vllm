[project]
name = "deepeval-vllm"
version = "0.1.1"
description = "Compatibility wrapper for DeepEval's LocalModel that adds native structured output support."
readme = "README.md"
authors = [
    { name = "profanta", email = "dev@profanta.de" }
]
requires-python = ">=3.12"
dependencies = [
    "deepeval>=4.1.8",
    "openai>=3.1.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
